name: 创想云耗材库存监控

on:
  # 定时执行：每30分钟检查一次
  schedule:
    - cron: '0 * * * *'
  # 支持手动触发（用于测试）
  workflow_dispatch:
    inputs:
      test_notify:
        description: '测试通知推送（勾选后会发送一条模拟有货通知到微信）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stock monitor
        env:
          CXY_TOKEN: ${{ secrets.CXY_TOKEN }}
          CXY_UID: ${{ secrets.CXY_UID }}
          CXY_DUID: ${{ secrets.CXY_DUID }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TEST_NOTIFY: ${{ github.event.inputs.test_notify }}
        run: python monitor.py

      - name: Commit state file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f stock_state.json ]; then
            git add stock_state.json
            git diff --staged --quiet || git commit -m "更新库存状态 - $(date +%Y-%m-%d_%H:%M)"
            git push
          fi
